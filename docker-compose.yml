# strop build/test/release services (plans/0002 §4, plans/0086 §8).
#   docker compose run --build --rm test            # fmt + clippy -D warnings + cargo test + Loom
#   docker compose run --build --rm proofs          # Lean proofs over the kernel translation
#   docker compose run --build --rm model           # TLC probation models
#   docker compose run --build --rm ssh-pythonfree  # real sshd, no Python on the host
#   docker compose run --build --rm -e VERSION=x.y.z release   # tarball → ./dist/
#   docker compose run --build --rm bench           # perf scenarios (measurement, not a gate)
# Every service above except bench is a blocking gate.

services:
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    # The gate runs at image-build time (RUN steps); if the image
    # exists, the gate passed. The command is just a confirmation.
    command: 'echo "gate passed: fmt + clippy -D warnings + cargo test + loom"'

  # The OpenSSH fixture deploys and launches the native worker inside a
  # Python-free image; the full test image intentionally has python3 for
  # other integration suites.
  ssh-pythonfree:
    build:
      context: .
      dockerfile: Dockerfile
      target: ssh-pythonfree
    command: 'echo "gate passed: real SSH native worker without Python"'

  model:
    build:
      context: .
      dockerfile: Dockerfile
      target: model
    # TLC runs at image-build time; the image existing IS the gate.
    command: 'echo "gate passed: editor protocol model checks clean (TLC)"'
  bench:
    build:
      context: .
      dockerfile: Dockerfile
      target: release
    # Measurement, not an assert (0025 §2): wall clock varies by machine.
    command: ["/app/target/release/strop", "--bench", "all"]

  # Exports a versioned tarball + checksum to ./dist/ (VERSION required).
  # Tarball layout is the install.sh contract:
  #   strop-<VERSION>-<TARGET>.tar.gz containing <dir>/strop
  release:
    build:
      context: .
      dockerfile: Dockerfile
      target: release
    command:
      - sh
      - -c
      - |
        set -e
        VERSION="$${VERSION:?set VERSION to the release version, e.g. -e VERSION=0.1.0}"
        TARGET="$${TARGET:-x86_64-unknown-linux-musl}"
        PKG="strop-$$VERSION-$$TARGET"
        staging="$$(mktemp -d)" \
        && mkdir -p "$$staging/$$PKG" \
        && install -m755 target/release/strop "$$staging/$$PKG/strop" \
        && tar -czf "/dist/$$PKG.tar.gz" -C "$$staging" "$$PKG" \
        && cd /dist \
        && sha256sum "$$PKG.tar.gz" > "$$PKG.tar.gz.sha256" \
        && echo "released: /dist/$$PKG.tar.gz"
    volumes:
      - ${STROP_DIST:-./dist}:/dist

  # plans/0086: the Lean gate over the Charon/Aeneas translation of
  # crates/strop-kernel — regenerate proofs/Extracted and refuse drift,
  # lake build, axiom audit, calibration mutants. Pinned toolchain shared
  # with gripsack's proofs image (linux/amd64 only).
  proofs:
    platform: linux/amd64
    build:
      context: .
      dockerfile: proofs/Dockerfile
      target: gate
