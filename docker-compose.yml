# strop build/test/release services (plan 0002 §4).
#   docker compose run --build --rm test      # fmt + clippy -D warnings + cargo test
#   docker compose run --build --rm build     # debug binary
#   docker compose run --build --rm -e VERSION=x.y.z release   # tarball → ./dist/
#   docker compose run --build --rm model     # TLC over the editor protocol (0024)
#   docker compose run --build --rm bench     # the perf gate suite (0025)

services:
  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: test
    # The gate runs at image-build time (RUN steps); if the image
    # exists, the gate passed. The command is just a confirmation.
    command: 'echo "gate passed: fmt + clippy -D warnings + cargo test"'


  # The OpenSSH fixture deploys and launches the native worker inside a
  # Python-free image; the full test image intentionally has python3 for
  # other integration suites.
  ssh-pythonfree:
    build:
      context: .
      dockerfile: Dockerfile
      target: ssh-pythonfree
    command: 'echo "gate passed: real SSH native worker without Python"'

  # Container integration tests (0037 DC1a + 0058 WK08): run on the
  # HOST engine via the socket; fixtures are uniquely labelled and
  # self-cleaning, and only the container-gated tests run here. In this
  # stage target/debug/strop IS the static musl worker the WK08
  # deployment tests upload and exec (STROP_WORKER_BINARY unset → the
  # tests discover it).
  container-test:
    build:
      context: .
      dockerfile: Dockerfile
      target: container-test
    environment:
      - STROP_CONTAINER_TESTS=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command:
      - sh
      - -c
      - cargo test --locked -p strop-containers -p strop-worker-deploy -p strop-git && cargo test --locked -p strop-editor --test container_editor

  # Same-source Verus gate (0057 VF18 / 0058 WK18), pinned verifier
  # toolchain outside the shipping build graph.
  verify:
    build:
      context: .
      dockerfile: Dockerfile
      target: verify
    command: 'echo "gate passed: edit geometry + worker admission verified (Verus)"'

  # The TLAPS proof gate (0057 VF17 / 0058 WK17): generalized safety of
  # SearchLifecycle, WorkerSession and WorkerDeploy with paired negative
  # controls, in its own pinned toolchain image. Kept out of
  # specs/gate.sh: the model stage has no tlapm, so chaining would
  # break that gate.
  tlaps:
    build:
      context: .
      dockerfile: Dockerfile
      target: tlaps
    command: 'echo "gate passed: search, worker-session and deploy safety proved (TLAPS)"'

  # The core-assurance lane (0057 VF19/VF20 + 0058 WK16–WK20):
  # claim/evidence digests, native Store/recovery/stream journeys,
  # instrumented Loom campaigns and semantic mutant kills. All RUN
  # steps gate at image-build time like the test lane.
  core-assurance:
    build:
      context: .
      dockerfile: Dockerfile
      target: core-assurance
    command: 'echo "gate passed: core assurance (inventory, native effects, loom, mutants)"'
  build:
    build:
      context: .
      dockerfile: Dockerfile
      target: bin
    command: cargo build --locked

  model:
    build:
      context: .
      dockerfile: Dockerfile
      target: model
    # TLC runs at image-build time; the image existing IS the gate.
    command: 'echo "gate passed: editor protocol model checks clean (TLC)"'
  bench:
    build:
      context: .
      dockerfile: Dockerfile
      target: release
    # Measurement, not an assert (0025 §2): wall clock varies by machine.
    command: ["/app/target/release/strop", "--bench", "all"]

  # Exports a versioned tarball + checksum to ./dist/ (VERSION required).
  # Tarball layout is the install.sh contract:
  #   strop-<VERSION>-<TARGET>.tar.gz containing <dir>/strop
  release:
    build:
      context: .
      dockerfile: Dockerfile
      target: release
    command:
      - sh
      - -c
      - |
        set -e
        VERSION="$${VERSION:?set VERSION to the release version, e.g. -e VERSION=0.1.0}"
        TARGET="$${TARGET:-x86_64-unknown-linux-musl}"
        PKG="strop-$$VERSION-$$TARGET"
        staging="$$(mktemp -d)" \
        && mkdir -p "$$staging/$$PKG" \
        && install -m755 target/release/strop "$$staging/$$PKG/strop" \
        && tar -czf "/dist/$$PKG.tar.gz" -C "$$staging" "$$PKG" \
        && cd /dist \
        && sha256sum "$$PKG.tar.gz" > "$$PKG.tar.gz.sha256" \
        && echo "released: /dist/$$PKG.tar.gz"
    volumes:
      - ./dist:/dist
