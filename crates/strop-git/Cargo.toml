[package]
name = "strop-git"
description = "strop git: libgit2 hunks vs live buffers, log/blame/permalinks"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
git2 = { version = "0.20", default-features = false }
serde = { version = "1", features = ["derive"] }
strop-core = { path = "../strop-core", version = "0.19.1" }
# path dependency, no new features: remote Git only needs the typed
# endpoint identity and the bounded remote-execution boundary (0036 RW8).
strop-remote = { path = "../strop-remote", version = "0.19.1" }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
