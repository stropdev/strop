[package]
name = "strop-worker-protocol"
description = "strop worker protocol (0058 WK02): one bounded versioned wire for local/SSH/container native workers — handshake, typed families, streaming payloads, typed refusals"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
strop-core = { path = "../strop-core", version = "0.35.0" }
strop-workspace = { path = "../strop-workspace", version = "0.35.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
