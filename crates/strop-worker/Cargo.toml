[package]
name = "strop-worker"
description = "Worker-side native kernel consumers: owned execution supervision over the shared strop-fs kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
strop-core = { path = "../strop-core", version = "0.35.0" }
strop-fs = { path = "../strop-fs", version = "0.35.0" }
strop-worker-protocol = { path = "../strop-worker-protocol", version = "0.35.0" }
strop-workspace = { path = "../strop-workspace", version = "0.35.0" }
parking_lot = "0.12"
thiserror = "2"
serde_json = "1"
getrandom = "0.4"
sha2 = "0.10"
ropey = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["pipe", "termios"] }
rustix-openpty = "=0.2.0"
libc = "0.2"

# 0058 WK11: Loom-instrumented campaigns over the REAL serve scheduler
# (serve/schedule.rs — admission registry and the two-lane outbound
# scheduler). Runs as `RUSTFLAGS="--cfg strop_loom" cargo test
# -p strop-worker loom` — the dependency and the instrumented seam exist
# only under cfg(strop_loom), never in release artifacts.
[target.'cfg(strop_loom)'.dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(strop_loom)", "cfg(strop_mutant)"] }

[dev-dependencies]
tempfile = "3"
