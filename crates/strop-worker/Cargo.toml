[package]
name = "strop-worker"
description = "Worker-side native kernel consumers: owned execution supervision over the shared strop-fs kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
strop-core = { path = "../strop-core", version = "0.35.0" }
strop-fs = { path = "../strop-fs", version = "0.35.0" }
strop-worker-protocol = { path = "../strop-worker-protocol", version = "0.35.0" }
strop-workspace = { path = "../strop-workspace", version = "0.35.0" }
parking_lot = "0.12"
thiserror = "2"
getrandom = "0.4"
sha2 = "0.10"
ropey = "1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["pipe"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
