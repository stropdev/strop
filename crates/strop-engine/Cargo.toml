[package]
name = "strop-engine"
description = "strop editor engine: documents, grammar, services and sessions — no frontend UI dependencies"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
homepage.workspace = true

[features]
# test-support also enables the in-process worker transport seam (WK04):
# dependents' tests cross the real codec against the in-process serve loop.
test-support = ["strop-trace/test-support", "strop-syntax/test-support"]
[dependencies]
strop-kernel = { path = "../strop-kernel" }
strop-trace = { path = "../strop-trace" }
strop-core = { path = "../strop-core" }
strop-terminal = { path = "../strop-terminal" }
strop-grammar = { path = "../strop-grammar" }
strop-picker = { path = "../strop-picker" }
strop-git = { path = "../strop-git" }
strop-syntax = { path = "../strop-syntax" }
strop-lsp = { path = "../strop-lsp" }
strop-workspace = { path = "../strop-workspace" }
strop-remote = { path = "../strop-remote" }
strop-fs = { path = "../strop-fs" }
imbl = { version = "7", features = ["serde"] }
unicode-segmentation = "1"
unicode-width = "0.2"
ropey.workspace = true
regex = "1"
nucleo-matcher = "0.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"
tempfile = "3"
thiserror = "2"
sha2 = "0.10"
parking_lot = "0.12"
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
strop-trace = { path = "../strop-trace", features = ["test-support"] }
strop-syntax = { path = "../strop-syntax", features = ["test-support"] }
# WK04: the engine's own tests cross the real worker codec against the
# in-process serve loop (transport seam, not a policy twin).
ratatui = "0.29"

# 0057 VF11: Loom-instrumented coordination campaigns over the REAL
# bounded event channel (editor/events/channel.rs). Runs as
# `RUSTFLAGS="--cfg strop_loom" cargo test -p strop-engine loom` — the
# dependency and the instrumented seam exist only under cfg(strop_loom), never
# in release artifacts.
[target.'cfg(strop_loom)'.dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(strop_loom)"] }
