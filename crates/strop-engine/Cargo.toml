[package]
name = "strop-engine"
description = "strop editor engine: documents, grammar, services and sessions — no frontend UI dependencies"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
test-support = ["strop-trace/test-support"]
[dependencies]
strop-trace = { path = "../strop-trace", version = "0.34.0" }
strop-core = { path = "../strop-core", version = "0.34.0" }
strop-terminal = { path = "../strop-terminal", version = "0.34.0" }
strop-grammar = { path = "../strop-grammar", version = "0.34.0" }
strop-picker = { path = "../strop-picker", version = "0.34.0" }
strop-git = { path = "../strop-git", version = "0.34.0" }
strop-syntax = { path = "../strop-syntax", version = "0.34.0" }
strop-lsp = { path = "../strop-lsp", version = "0.34.0" }
strop-workspace = { path = "../strop-workspace", version = "0.34.0" }
strop-containers = { path = "../strop-containers", version = "0.34.0" }
strop-remote = { path = "../strop-remote", version = "0.34.0" }
strop-fs = { path = "../strop-fs", version = "0.34.0" }
imbl = { version = "7", features = ["serde"] }
unicode-segmentation = "1"
unicode-width = "0.2"
ropey = "1"
regex = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
strop-trace = { path = "../strop-trace", version = "0.34.0", features = ["test-support"] }
ratatui = "0.29"

# 0057 VF11: Loom-instrumented coordination campaigns over the REAL
# bounded event channel (editor/events/channel.rs). Runs as
# `RUSTFLAGS="--cfg strop_loom" cargo test -p strop-engine loom` — the
# dependency and the instrumented seam exist only under cfg(strop_loom), never
# in release artifacts.
[target.'cfg(strop_loom)'.dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(strop_loom)"] }
