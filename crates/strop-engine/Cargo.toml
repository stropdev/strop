[package]
name = "strop-engine"
description = "strop editor engine: documents, grammar dispatch, services, sessions — no terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
test-support = ["strop-trace/test-support"]
[dependencies]
strop-trace = { path = "../strop-trace", version = "0.31.1" }
strop-core = { path = "../strop-core", version = "0.31.1" }
strop-grammar = { path = "../strop-grammar", version = "0.31.1" }
strop-picker = { path = "../strop-picker", version = "0.31.1" }
strop-git = { path = "../strop-git", version = "0.31.1" }
strop-syntax = { path = "../strop-syntax", version = "0.31.1" }
strop-lsp = { path = "../strop-lsp", version = "0.31.1" }
strop-workspace = { path = "../strop-workspace", version = "0.31.1" }
strop-containers = { path = "../strop-containers", version = "0.31.1" }
strop-remote = { path = "../strop-remote", version = "0.31.1" }
strop-fs = { path = "../strop-fs", version = "0.31.1" }
imbl = { version = "7", features = ["serde"] }
unicode-segmentation = "1"
unicode-width = "0.2"
ropey = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
toml = "0.8"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
strop-trace = { path = "../strop-trace", version = "0.31.1", features = ["test-support"] }
ratatui = "0.29"
