[package]
name = "strop-fs"
description = "Owned native filesystem observations, checked operations and receipts for strop"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
strop-core = { path = "../strop-core", version = "0.31.0" }
strop-workspace = { path = "../strop-workspace", version = "0.31.0" }
strop-remote = { path = "../strop-remote", version = "0.31.0" }
strop-containers = { path = "../strop-containers", version = "0.31.0" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
ropey = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
getrandom = "0.4"
unicode-normalization = "0.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }
libc = "0.2"
