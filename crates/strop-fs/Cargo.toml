[package]
name = "strop-fs"
description = "Owned native filesystem observations, checked operations and receipts for strop"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
homepage.workspace = true

[dependencies]
strop-core = { path = "../strop-core" }
strop-workspace = { path = "../strop-workspace" }
serde = { version = "1", features = ["derive", "rc"] }
thiserror = "2"
ropey.workspace = true
sha2 = "0.10"
getrandom = "0.4"
unicode-normalization = "0.1"
rustix = { version = "1", features = ["fs", "process"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
