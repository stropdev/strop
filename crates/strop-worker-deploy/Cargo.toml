[package]
name = "strop-worker-deploy"
description = "Worker artifact deployment and private-cache admission over authenticated providers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
strop-containers = { path = "../strop-containers", version = "0.35.0" }
strop-core = { path = "../strop-core", version = "0.35.0" }
strop-worker-client = { path = "../strop-worker-client", version = "0.35.0" }
strop-worker-protocol = { path = "../strop-worker-protocol", version = "0.35.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
getrandom = "0.4"

[dev-dependencies]
tempfile = "3"
strop-workspace = { path = "../strop-workspace", version = "0.35.0" }
