[package]
name = "strop-containers"
description = "Docker browsing and admitted execution, file writes, and Dev Container lifecycle"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
strop-core = { path = "../strop-core", version = "0.52.0" }
