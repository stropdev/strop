[package]
name = "strop-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Owned local terminal sessions and bounded VT snapshots for strop"
build = "build.rs"
include = ["Cargo.toml", "src/**", "native/**", "vendor/**", "build.rs"]

[dependencies]
strop-core = { path = "../strop-core", version = "0.32.1" }
ropey = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
imbl = { version = "7", features = ["serde"] }
parking_lot = "0.12"
libc = "0.2"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process", "event", "net", "termios"] }
rustix-openpty = "=0.2.0"

[build-dependencies]
cc = "1"
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
