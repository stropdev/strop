[package]
name = "strop-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
homepage.workspace = true
description = "Owned terminal sessions (in-process PTY, local or over ssh) and bounded VT snapshots for strop"
build = "build.rs"

[dependencies]
strop-core = { path = "../strop-core" }
strop-remote = { path = "../strop-remote" }
ropey.workspace = true
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
imbl = { version = "7", features = ["serde"] }
parking_lot = "0.12"
rustix = { version = "1", features = ["pipe", "termios"] }
rustix-openpty = "=0.2.0"
libc = "0.2"

[build-dependencies]
cc = "1"
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
