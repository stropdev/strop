[package]
name = "strop-terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Owned terminal sessions (PTY on the namespace's worker) and bounded VT snapshots for strop"
build = "build.rs"
include = ["Cargo.toml", "src/**", "native/**", "vendor/**", "build.rs"]

[dependencies]
strop-core = { path = "../strop-core", version = "0.35.0" }
strop-worker-client = { path = "../strop-worker-client", version = "0.35.0" }
strop-worker-protocol = { path = "../strop-worker-protocol", version = "0.35.0" }
ropey = "1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
imbl = { version = "7", features = ["serde"] }
parking_lot = "0.12"
libc = "0.2"



[build-dependencies]
cc = "1"
flate2 = "1"
tar = "0.4"

[dev-dependencies]
tempfile = "3"
