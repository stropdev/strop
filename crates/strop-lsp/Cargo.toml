[package]
name = "strop-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "strop lsp: async-lsp client, server registry, diagnostics store"

[dependencies]
strop-core = { path = "../strop-core", version = "0.65.0" }
strop-workspace = { path = "../strop-workspace", version = "0.65.0" }
strop-trace = { path = "../strop-trace", version = "0.65.0" }
async-lsp = "0.2"
tokio = { version = "1", features = ["rt", "io-util", "time", "sync", "process"] }
tokio-util = { version = "0.7", features = ["compat"] }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
parking_lot = "0.12"
toml = "0.8"
ropey = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

# 0057 VF11: Loom-instrumented campaigns over the REAL bounded wire
# queue (client/queue.rs). Runs as `RUSTFLAGS="--cfg strop_loom" cargo test
# -p strop-lsp loom` — the dependency and the seam exist only under
# cfg(strop_loom), never in release artifacts.
[target.'cfg(strop_loom)'.dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(strop_loom)"] }
