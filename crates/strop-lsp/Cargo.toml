[package]
name = "strop-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "strop lsp: async-lsp client, server registry, diagnostics store"

[dependencies]
strop-core = { path = "../strop-core", version = "0.15.1" }
ropey = "1"
strop-trace = { path = "../strop-trace", version = "0.15.1" }
async-lsp = "0.2"
tokio = { version = "1", features = ["rt", "process", "io-util", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
toml = "0.8"
