[package]
name = "strop-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "strop lsp: async-lsp client, server registry, diagnostics store"

[dependencies]
strop-core = { path = "../strop-core", version = "0.21.0" }
strop-workspace = { path = "../strop-workspace", version = "0.21.0" }
strop-containers = { path = "../strop-containers", version = "0.21.0" }
strop-remote = { path = "../strop-remote", version = "0.21.0" }
strop-trace = { path = "../strop-trace", version = "0.21.0" }
async-lsp = "0.2"
tokio = { version = "1", features = ["rt", "process", "io-util", "time", "sync"] }
tokio-util = { version = "0.7", features = ["compat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
toml = "0.8"
ropey = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
