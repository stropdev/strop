[package]
name = "strop-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "strop lsp: async-lsp client, server registry, diagnostics store"

[dependencies]
strop-core = { path = "../strop-core", version = "0.35.0" }
strop-workspace = { path = "../strop-workspace", version = "0.35.0" }
strop-trace = { path = "../strop-trace", version = "0.35.0" }
# Every LSP server process belongs to its namespace's worker.
# No second local supervisor or remote interpreter transport survives.
strop-worker-protocol = { path = "../strop-worker-protocol", version = "0.35.0" }
strop-worker-client = { path = "../strop-worker-client", version = "0.35.0" }
async-lsp = "0.2"
tokio = { version = "1", features = ["rt", "io-util", "time", "sync"] }
tokio-util = { version = "0.7", features = ["compat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
toml = "0.8"
ropey = "1"

[dev-dependencies]
tempfile = "3"
# dev only: the loopback worker crosses the real codec in-process, the
# same handlers the shipped worker serves.
strop-worker = { path = "../strop-worker", version = "0.35.0" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# 0057 VF11: Loom-instrumented campaigns over the REAL bounded wire
# queue (client/queue.rs). Runs as `RUSTFLAGS="--cfg strop_loom" cargo test
# -p strop-lsp loom` — the dependency and the seam exist only under
# cfg(strop_loom), never in release artifacts.
[target.'cfg(strop_loom)'.dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(strop_loom)"] }
