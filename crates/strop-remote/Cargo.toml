[package]
name = "strop-remote"
description = "Owned SSH remote-file transport and native path identity for strop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
strop-core = { path = "../strop-core", version = "0.16.0" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt", "process", "io-util", "time"] }

[dev-dependencies]
serde_json = "1"
