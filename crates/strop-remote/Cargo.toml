[package]
name = "strop-remote"
description = "Remote files and commands over plain multiplexed SSH for strop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
strop-core = { path = "../strop-core", version = "0.63.0" }
strop-workspace = { path = "../strop-workspace", version = "0.63.0" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
rustix = { version = "1", features = ["process"] }
parking_lot = "0.12"
tokio = { version = "1", features = ["rt", "process", "io-util", "time"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
