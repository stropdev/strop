[package]
name = "strop-remote"
description = "Owned SSH remote-file transport and native path identity for strop"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
strop-core = { path = "../strop-core", version = "0.19.1" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt", "process", "io-util", "time"] }
ropey = "1"
sha2 = "0.10"
serde_json = "1"

[dev-dependencies]
tempfile = "3"
