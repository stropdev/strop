[package]
name = "strop-remote"
description = "Owned SSH remote-file transport over strop-workspace identity"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-support = []

[dependencies]
strop-core = { path = "../strop-core", version = "0.35.0" }
strop-workspace = { path = "../strop-workspace", version = "0.35.0" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
strop-worker-protocol = { path = "../strop-worker-protocol", version = "0.35.0" }
strop-worker-client = { path = "../strop-worker-client", version = "0.35.0" }
strop-worker-deploy = { path = "../strop-worker-deploy", version = "0.35.0" }
parking_lot = "0.12"
tokio = { version = "1", features = ["rt", "process", "io-util", "time"] }

[dev-dependencies]
tempfile = "3"
serde_json = "1"
