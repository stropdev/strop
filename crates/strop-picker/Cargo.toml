[package]
name = "strop-picker"
description = "strop picker: fzf-style scoring, streaming file/grep sources"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ignore = "0.4"
nucleo-matcher = "0.3"
imbl = { version = "7", features = ["serde"] }
parking_lot = "0.12"
strop-core = { path = "../strop-core", version = "0.35.0" }
strop-workspace = { path = "../strop-workspace", version = "0.35.0" }
strop-remote = { path = "../strop-remote", version = "0.35.0" }
strop-worker-protocol = { path = "../strop-worker-protocol", version = "0.35.0" }
strop-syntax = { path = "../strop-syntax", version = "0.35.0" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
globset = "0.4"
regex = "1"
ropey = "1"
base64 = "0.22"
thiserror = "2"

[dev-dependencies]
nucleo-matcher = "0.3"
strop-remote = { path = "../strop-remote", version = "0.35.0", features = ["test-support"] }
strop-worker = { path = "../strop-worker", version = "0.35.0" }
strop-worker-client = { path = "../strop-worker-client", version = "0.35.0" }
tempfile = "3"
