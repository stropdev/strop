[package]
name = "strop-picker"
description = "strop picker: fzf-style scoring, streaming file/grep sources"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ignore = "0.4"
nucleo-matcher = "0.3"
strop-core = { path = "../strop-core", version = "0.16.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
nucleo-matcher = "0.3"
