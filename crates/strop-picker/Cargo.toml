[package]
name = "strop-picker"
description = "strop picker: fzf-style scoring, streaming file/grep sources"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
ignore = "0.4"
grep = "0.3"
nucleo-matcher = "0.3"
imbl = { version = "7", features = ["serde"] }
parking_lot = "0.12"
strop-core = { path = "../strop-core" }
strop-workspace = { path = "../strop-workspace" }
strop-fs = { path = "../strop-fs" }
strop-lsp = { path = "../strop-lsp" }
strop-remote = { path = "../strop-remote" }
strop-syntax = { path = "../strop-syntax" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
globset = "0.4"
regex = "1"
ropey.workspace = true
base64 = "0.22"

[dev-dependencies]
nucleo-matcher = "0.3"
tempfile = "3"
flate2 = "1"
