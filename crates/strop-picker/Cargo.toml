[package]
name = "strop-picker"
description = "strop picker: fzf-style scoring, streaming file/grep sources"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
ignore = "0.4"
nucleo-matcher = "0.3"
imbl = { version = "7", features = ["serde"] }
parking_lot = "0.12"
strop-core = { path = "../strop-core", version = "0.20.1" }
strop-workspace = { path = "../strop-workspace", version = "0.20.1" }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"

[dev-dependencies]
nucleo-matcher = "0.3"
