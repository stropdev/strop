[package]
name = "strop-editor"
description = "strop — a modal text editor in Rust: see the cut before you make it"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
strop-core = { path = "../strop-core", version = "0.2.0" }
strop-grammar = { path = "../strop-grammar", version = "0.2.0" }
strop-picker = { path = "../strop-picker", version = "0.2.0" }
strop-git = { path = "../strop-git", version = "0.2.0" }
strop-syntax = { path = "../strop-syntax", version = "0.2.0" }
strop-lsp = { path = "../strop-lsp", version = "0.2.0" }
crossterm = "0.28"
ratatui = "0.29"
ropey = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indicatif = "0.17"
toml = "0.8"

[[bin]]
name = "strop"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
