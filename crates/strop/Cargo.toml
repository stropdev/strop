[package]
name = "strop-editor"
description = "strop — a modal text editor in Rust: Vim's keys, nothing to configure"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
strop-engine = { path = "../strop-engine" }
strop-trace = { path = "../strop-trace" }
strop-core = { path = "../strop-core" }
strop-terminal = { path = "../strop-terminal" }
strop-grammar = { path = "../strop-grammar" }
strop-picker = { path = "../strop-picker" }
strop-git = { path = "../strop-git" }
strop-syntax = { path = "../strop-syntax" }
strop-lsp = { path = "../strop-lsp" }
strop-workspace = { path = "../strop-workspace" }
strop-remote = { path = "../strop-remote" }
unicode-segmentation = "1"
crossterm = "0.28"
signal-hook = "0.3"
ratatui = "0.29"
ropey.workspace = true
serde_json = "1"
indicatif = "0.17"
tempfile = "3"
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
# musl's allocator made every keystroke 2–3× slower (RFC 2026-11-28 D1)
mimalloc = { version = "0.1", default-features = false }

[[bin]]
name = "strop"
path = "src/main.rs"

[dev-dependencies]
libc = "0.2"
vt100 = "0.15"
strop-engine = { path = "../strop-engine", features = ["test-support"] }
strop-trace = { path = "../strop-trace", features = ["test-support"] }
