[package]
name = "strop-editor"
description = "strop — a modal text editor in Rust: see the cut before you make it"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
strop-engine = { path = "../strop-engine", version = "0.22.0" }
strop-trace = { path = "../strop-trace", version = "0.22.0" }
strop-core = { path = "../strop-core", version = "0.22.0" }
strop-grammar = { path = "../strop-grammar", version = "0.22.0" }
strop-picker = { path = "../strop-picker", version = "0.22.0" }
strop-git = { path = "../strop-git", version = "0.22.0" }
strop-syntax = { path = "../strop-syntax", version = "0.22.0" }
strop-lsp = { path = "../strop-lsp", version = "0.22.0" }
strop-workspace = { path = "../strop-workspace", version = "0.22.0" }
strop-remote = { path = "../strop-remote", version = "0.22.0" }
unicode-segmentation = "1"
crossterm = "0.28"
ratatui = "0.29"
ropey = "1"
serde_json = "1"
indicatif = "0.17"
tempfile = "3"

[[bin]]
name = "strop"
path = "src/main.rs"

[dev-dependencies]
vt100 = "0.15"
strop-engine = { path = "../strop-engine", features = ["test-support"] }
strop-trace = { path = "../strop-trace", version = "0.22.0", features = ["test-support"] }
