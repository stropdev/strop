[package]
name = "strop-grammar"
description = "strop grammar: pure vim operator-pending resolver (motions, text objects, counts)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
strop-core = { path = "../strop-core" }
strop-kernel = { path = "../strop-kernel" }
memchr = "2"
ropey.workspace = true
serde = { version = "1", features = ["derive"] }
unicode-normalization = "0.1"
