[package]
name = "strop-core"
description = "strop editor core: rope buffer, byte-offset positions, edit ops"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
strop-trace = { path = "../strop-trace", version = "0.31.0" }
ropey = "1"
serde = { version = "1", features = ["derive", "rc"] }
unicode-segmentation = "1"
vstd = "=0.0.0-2026-09-06-0133"
verus_builtin = "=0.0.0-2026-09-06-0133"
verus_builtin_macros = "=0.0.0-2026-09-06-0133"
unicode-width = "0.2"
thiserror = "2"
parking_lot = "0.12"

tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# cargo-verus verifies only opted-in crates (0045).
[package.metadata.verus]
verify = true
