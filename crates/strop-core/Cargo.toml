[package]
name = "strop-core"
description = "strop editor core: rope buffer, byte-offset positions, edit ops"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
strop-kernel = { path = "../strop-kernel" }
strop-trace = { path = "../strop-trace", version = "0.70.0" }
ropey.workspace = true
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
unicode-segmentation = "1"
unicode-width = "0.2"
sha2 = "0.10"
thiserror = "2"
parking_lot = "0.12"

tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# 0108 D3: Loom campaign over the worker envelope (worker.rs). Runs as
# `RUSTFLAGS="--cfg strop_loom" cargo test -p strop-core loom` — the
# dependency and the seam exist only under cfg(strop_loom), never in
# release artifacts.
[target.'cfg(strop_loom)'.dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(strop_loom)"] }
