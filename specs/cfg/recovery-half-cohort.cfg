\* Recovery faulty variant 1: publication MERGES the new cohort into the
\* old store instead of replacing it, so drafts absent from the new cohort
\* keep their old-cohort records — half of an older checkpoint mixed with
\* half of a newer one.
\* Must die by EXACTLY CohortCoherent and DurableMatchesLastComplete.
SPECIFICATION Spec
CONSTANTS
    DOCS = {d1, d2}
    REMOTE = {d2}
    REV_MAX = 2
    COHORT_MAX = 3
    MUTATION = 1
CHECK_DEADLOCK FALSE
\* Budgets are model artifacts, not protocol states: a spent cohort
\* budget must not freeze staleness the u64 counter would recapture.
CONSTRAINT
    CohortBudgetHonest
INVARIANTS
    TypeOK
    CohortCoherent
    DurableMatchesLastComplete
    SaveRetiresOnlySuperseded
    CheckpointNeverCleans
    RemoteConsentGated
    RestoreNeverWritesDisk

