\* RemoteProcess faulty variant 2: the anchor is reaped BEFORE the final
\* killpg and the group capability is not revoked, so the late killpg
\* fires on a PID/PGID the OS has already recycled - possibly to a foreign
\* process - and the straggler group is never actually signalled. Two
\* remote pids plus the foreign-process domain make the wrong-PID kill
\* observable. Must die by EXACTLY ReapAfterFinalKill and
\* SignalOwnedTarget (the temporal companion config checks the orphan).
SPECIFICATION Spec
CONSTANTS
    REQS = {1}
    LPIDS = {101}
    RPIDS = {1, 2}
    MAXBUF = 2
    MAXPEND = 2
    MUTATION = 2
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    TerminalOnce
    LaunchGated
    SignalOwnedTarget
    ReapAfterFinalKill
    NoPostEofDelivery
    OutcomeClean
    NoUnownedSsh
