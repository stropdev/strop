\* LspWire faulty variant 3: didClose skips the pending-request
\* cancellation, so the startup flush dispatches them — a request frame
\* lands after its document's Close. Must die by EXACTLY WireOrdered.
SPECIFICATION Spec
CONSTANTS
    DOCS = {d1}
    VER_MAX = 3
    REQ_MAX = 2
    QMAX = 3
    PEND_MAX = 2
    MUTATION = 3
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    WireOrdered
    VersionsIncrease
    CoalesceLegal
    BindingOnlyIfAdmitted
    TerminalOnce
    RequestAccounted
    LateNeverApplies
    Bounded
