\* Install vacuity witnesses: a verified update, a digest refusal, an
\* interruption preserving the old install, a manager refusal, an
\* unknown-receipt refusal, a stale-catalog no-op, previous-version
\* carry-forward, the honest receipt lag after a successful rename and a
\* fresh install — all must be reachable in the honest model. The gate
\* checks each witness separately and stops at its first counterexample.
SPECIFICATION Spec
CONSTANTS
    MUTATION = 0
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    WitnessNoUpdate
    WitnessNoDigestRefusal
    WitnessNoInterrupt
    WitnessNoManagerRefusal
    WitnessNoUnknownRefusal
    WitnessNoStaleNoop
    WitnessNoReceiptCarry
    WitnessNoReceiptLag
    WitnessNoFreshInstall
