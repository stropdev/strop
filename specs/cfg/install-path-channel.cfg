\* Install faulty variant 3: channel identity is inferred from path
\* substrings, so a manager-owned (or unknown) install is overwritten.
\* Must die by EXACTLY ChannelGate.
SPECIFICATION Spec
CONSTANTS
    MUTATION = 3
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    InstalledComplete
    VerifiedBeforeActivation
    ChannelGate
    NoClobberOnFailure
    ReceiptNeverAhead
    StaleNeverPublishes
