\* SftpWire vacuity witness: SUCCESS must be reachable in the honest
\* model (connect v3 -> handle -> regular+known attrs -> capped reads ->
\* UTF-8 -> close ok -> publish). This run EXPECTS WitnessNoSuccess to be
\* violated; specs/ssh-gate.sh treats that as the pass condition.
SPECIFICATION Spec
CONSTANTS
    MAXPACKET = 3
    MAXSNAP = 4
    CHUNK = 2
    FSIZE = 3
    FILE_UTF8 = TRUE
    MAXSEQ = 8
    MUTATION = 0
CHECK_DEADLOCK FALSE
INVARIANTS
    WitnessNoSuccess
