\* SftpWire faulty variant 1: the reply-id gate in PostFrame is removed,
\* so a reply minted for a different request is consumed as an answer.
\* Must die by EXACTLY ReplyIdentity (specs/ssh-gate.sh enforces the set).
SPECIFICATION Spec
CONSTANTS
    MAXPACKET = 3
    MAXSNAP = 4
    CHUNK = 2
    FSIZE = 3
    FILE_UTF8 = TRUE
    MAXSEQ = 8
    MUTATION = 1
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    ReplyIdentity
    PacketBounded
    SnapshotBounded
    CompleteBeforeSuccess
