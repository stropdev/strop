\* LspWire: the AR06 bounded queue + sync-binding contract (MUTATION = 0).
\* Calibration (0057 VF05 gate chaining): ONE document on the one modeled
\* path — every invariant quantifies over wire/queue/admission/binding/
\* request state, none over DOCS, and close/reopen incarnation identity
\* rides on the (rev, conn, allocator) stamps, so a second document only
\* doubled editor-side branching (measured: DOCS={d1,d2} does not settle
\* — 54M+ distinct states and growing at VER_MAX = 3; DOCS={d1} settles
\* exhaustively at 4.0M distinct states in ~20 s). VER_MAX = 3 is the
\* honest minimum: the reopen journey spends v1/v2 and a post-reopen
\* coalesce needs v3, and 3 keeps the admission-sequence domain honest
\* (per connection: <= 3 version admissions + <= 3 closes + 2 requests =
\* 8, so two connections fit admSeq <= 16). QMAX and PEND_MAX are the
\* shrunken admission bounds (production: 256/64); QMAX = 3 leaves room
\* for a change, a request barrier and a second change in flight.
SPECIFICATION Spec
CONSTANTS
    DOCS = {d1}
    VER_MAX = 3
    REQ_MAX = 2
    QMAX = 3
    PEND_MAX = 2
    MUTATION = 0
\* Once the version/request/admission budgets are spent, no action is
\* enabled — a model artifact, not a protocol deadlock.
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    WireOrdered
    VersionsIncrease
    CoalesceLegal
    BindingOnlyIfAdmitted
    TerminalOnce
    RequestAccounted
    LateNeverApplies
    Bounded
