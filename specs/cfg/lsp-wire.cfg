\* LspWire: the AR06 bounded queue + sync-binding contract (MUTATION = 0).
\* Two documents on one path keep close/reopen incarnation representable;
\* VER_MAX bounds version allocation (each open/change spends one), QMAX
\* and PEND_MAX are the shrunken admission bounds (production: 256/64).
SPECIFICATION Spec
CONSTANTS
    DOCS = {d1, d2}
    VER_MAX = 5
    REQ_MAX = 2
    QMAX = 3
    PEND_MAX = 2
    MUTATION = 0
\* Once the version/request/admission budgets are spent, no action is
\* enabled — a model artifact, not a protocol deadlock.
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    WireOrdered
    VersionsIncrease
    CoalesceLegal
    BindingOnlyIfAdmitted
    TerminalOnce
    RequestAccounted
    LateNeverApplies
    Bounded
