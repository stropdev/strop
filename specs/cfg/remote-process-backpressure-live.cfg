\* RemoteProcess faulty variant 3, temporal companion: with the buffer
\* full and the worker never reading (arbitrary code, no fairness), the
\* supervisor never observes the pending EOF - cancellation is lost under
\* input backpressure. The honest mask observes it regardless. NoPostEofDelivery
\* is omitted (checked by remote-process-backpressure.cfg).
SPECIFICATION FairSpec
CONSTANTS
    REQS = {1}
    LPIDS = {101}
    RPIDS = {1, 2}
    MAXBUF = 1
    MAXPEND = 1
    MUTATION = 3
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    TerminalOnce
    LaunchGated
    SignalOwnedTarget
    ReapAfterFinalKill
    OutcomeClean
    NoUnownedSsh
PROPERTY EventuallyEofObserved
