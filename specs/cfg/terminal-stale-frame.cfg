\* Terminal faulty variant 1: the entry drops the freshness/identity
\* guard and accepts a stale frame (a revision at or below the one
\* already accepted). Must die by EXACTLY FrameFresh.
SPECIFICATION Spec
CONSTANTS
    SESSIONS = {s1, s2}
    REV_MAX = 2
    MUTATION = 1
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    FrameFresh
    PinnedNeverDragged
    TerminalAbsorbing
    ExitBoundary
    ExitAnnouncedOnce
    InputNeverToDead
    GeometryOwned
    OutputNeverMutates
