\* RemoteProcess liveness: FairSpec adds weak fairness ONLY for committed
\* protocol code (OwnedProcess + run(), the supervisor/anchor machine, the
\* relay) plus two explicitly documented ASSUMPTIONS: EofObserve (sshd
\* delivers the channel close - no heartbeat enforces it across a
\* partition) and SshExits (the exit-status channel holds). FinalKill
\* assumes SIGKILL delivery to the group. The worker's arbitrary code and
\* the caller carry no fairness, so EventuallyTerminal is claimed only
\* once the request is committed. Small projection: one buffer chunk, one
\* pending chunk, two remote pids (at most one is foreign, so a child slot exists).
SPECIFICATION FairSpec
CONSTANTS
    REQS = {1}
    LPIDS = {101}
    RPIDS = {1, 2}
    MAXBUF = 1
    MAXPEND = 1
    MUTATION = 0
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    TerminalOnce
    LaunchGated
    SignalOwnedTarget
    ReapAfterFinalKill
    NoPostEofDelivery
    OutcomeClean
    NoUnownedSsh
PROPERTY
    EventuallyTerminal
    EventuallyRemoteSettled
    EventuallyEofObserved
