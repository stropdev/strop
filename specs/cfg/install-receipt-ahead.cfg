\* Install faulty variant 4: the receipt is refreshed with the new
\* version even when the transaction aborted — the receipt names a
\* version that was never installed. Must die by EXACTLY
\* ReceiptNeverAhead.
SPECIFICATION Spec
CONSTANTS
    MUTATION = 4
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    InstalledComplete
    VerifiedBeforeActivation
    ChannelGate
    NoClobberOnFailure
    ReceiptNeverAhead
    StaleNeverPublishes
