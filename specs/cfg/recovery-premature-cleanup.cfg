\* Recovery faulty variant 2: a failed/interrupted publication CLEARS the
\* durable store — cleanup destroys the last complete checkpoint before a
\* newer one is durable.
\* Must die by EXACTLY DurableMatchesLastComplete.
SPECIFICATION Spec
CONSTANTS
    DOCS = {d1, d2}
    REMOTE = {d2}
    REV_MAX = 2
    COHORT_MAX = 3
    MUTATION = 2
CHECK_DEADLOCK FALSE
\* Budgets are model artifacts, not protocol states: a spent cohort
\* budget must not freeze staleness the u64 counter would recapture.
CONSTRAINT
    CohortBudgetHonest
INVARIANTS
    TypeOK
    CohortCoherent
    DurableMatchesLastComplete
    SaveRetiresOnlySuperseded
    CheckpointNeverCleans
    RemoteConsentGated
    RestoreNeverWritesDisk

