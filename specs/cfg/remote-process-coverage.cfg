\* RemoteProcess vacuity witnesses: admission, a GO'd launch, a running
\* worker, an Exited outcome, cancellation observed mid-run, EOF observed
\* with a full relay buffer (the events=0 mask), an inherited straggler
\* swept by the final killpg, and the honesty window where the local ssh
\* is dead but the remote has not yet seen EOF - all must be reachable in
\* the honest model. The gate checks each witness separately and stops at
\* its first counterexample.
SPECIFICATION Spec
CONSTANTS
    REQS = {1}
    LPIDS = {101}
    RPIDS = {1, 2}
    MAXBUF = 2
    MAXPEND = 2
    MUTATION = 0
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    WitnessNoAdmission
    WitnessNoLaunch
    WitnessNoWorkerRun
    WitnessNoExitOutcome
    WitnessNoCancelDuringRun
    WitnessNoBackpressuredEof
    WitnessNoStragglerCleanup
    WitnessNoPartitionWindow
