\* SftpWire faulty variant 3: the response frame is allocated before its
\* bounds are checked, so 0-length and oversized frames become
\* allocations (wire.rs exchange()'s gate is the guard being removed).
\* Must die by EXACTLY PacketBounded.
SPECIFICATION Spec
CONSTANTS
    MAXPACKET = 3
    MAXSNAP = 4
    CHUNK = 2
    FSIZE = 3
    FILE_UTF8 = TRUE
    MAXSEQ = 8
    MUTATION = 3
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    ReplyIdentity
    PacketBounded
    SnapshotBounded
    CompleteBeforeSuccess
