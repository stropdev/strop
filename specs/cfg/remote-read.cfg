\* RemoteRead: the shipped lifecycle, honest guards (MUTATION = 0).
\* Two requests model supersede/refresh racing one live worker; two pids
\* make OS pid recycling representable. MAXFOCUS/MAXREV/MAXHEAD only bound
\* the finite state space (see the module header for what is not claimed).
SPECIFICATION Spec
CONSTANTS
    REQS = {1, 2}
    PIDS = {1, 2}
    MAXFOCUS = 2
    MAXREV = 2
    MAXHEAD = 2
    MUTATION = 0
\* All-worker-terminal states are intended; user/editor actions may all
\* be disabled once budgets are spent. Not a protocol deadlock.
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    FreshPublication
    TerminalOnce
    CancellationWins
    SignalOwnedPid
    NoUnownedChild
    ReadonlyPublication
