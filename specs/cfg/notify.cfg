\* Notify: the 0058 filesystem-notification lifecycle contract
\* (MUTATION = 0). Exhaustive safety runs at one client: the model has
\* no cross-client action (subscriptions, hints, loss and publication
\* are all per-client; only the worker incarnation and the monotone
\* fault/witness counters are shared), so the two-client state space is
\* the independent product and adds no behavior — it is the Recovery.tla
\* blowup pattern. Identity separation IS exercised at two clients:
\* every mutant and witness config below keeps CLIENTS = {c1, c2},
\* including WitnessNoTwoEstablished. Budgets: one worker restart
\* (INC_MAX = 2), one reinstallation with a bumped generation
\* (GEN_MAX = 2), two revisions (REV_MAX = 2: the save race and the
\* stale-reload drop), QMAX = 1 forces the overflow path early. Budget
\* exhaustion is a model artifact, not a protocol deadlock.
SPECIFICATION Spec
CONSTANTS
    CLIENTS = {c1}
    INC_MAX = 2
    GEN_MAX = 2
    REV_MAX = 2
    QMAX = 1
    MUTATION = 0
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    HintsNeverAuthority
    StaleIdentityNeverActs
    AmbiguousNeverRelocates
    FreshRequiresCoverage
    CoalesceNeverLosesStaleness
    ScanNeverErasesNewer
    DirtyNeverClobbered
    StaleReloadNeverClears
    CoverageHonest
    BoundedQueue
