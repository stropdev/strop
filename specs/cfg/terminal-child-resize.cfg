    MUTATION = 6
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    FrameFresh
    PinnedNeverDragged
    TerminalAbsorbing
    ExitBoundary
    ExitAnnouncedOnce
    InputNeverToDead
    GeometryOwned
    OutputNeverMutates
