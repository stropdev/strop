\* RemoteProcess faulty variant 1: the anchor forks the worker without
\* waiting for the supervisor's GO on the launch-gate pipe (and even after
\* the gate closed on cancellation). A worker then exists that was never
\* authorized - exactly what the READY->GO handshake forbids.
\* Must die by EXACTLY LaunchGated.
SPECIFICATION Spec
CONSTANTS
    REQS = {1}
    LPIDS = {101}
    RPIDS = {1, 2}
    MAXBUF = 2
    MAXPEND = 2
    MUTATION = 1
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    TerminalOnce
    LaunchGated
    SignalOwnedTarget
    ReapAfterFinalKill
    NoPostEofDelivery
    OutcomeClean
    NoUnownedSsh
