\* Recovery: the AR04 cohort checkpoint/publish/restore contract
\* (MUTATION = 0). Two documents (d2 remote) keep cohort coherence,
\* consent gating and cross-draft retirement representable; the revision
\* and cohort budgets bound the clocks.
SPECIFICATION Spec
CONSTANTS
    DOCS = {d1, d2}
    REMOTE = {d2}
    REV_MAX = 2
    COHORT_MAX = 3
    MUTATION = 0
\* Once the revision, cohort and witness budgets are spent, no action is
\* enabled — a model artifact, not a protocol deadlock.
CHECK_DEADLOCK FALSE
\* Budgets are model artifacts, not protocol states: a spent cohort
\* budget must not freeze staleness the u64 counter would recapture.
CONSTRAINT
    CohortBudgetHonest
INVARIANTS
    TypeOK
    CohortCoherent
    DurableMatchesLastComplete
    SaveRetiresOnlySuperseded
    CheckpointNeverCleans
    RemoteConsentGated
    RestoreNeverWritesDisk

