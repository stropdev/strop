\* Recovery: the AR04 cohort checkpoint/publish/restore contract
\* (MUTATION = 0). Calibration (0057 VF13 gate chaining): two documents
\* (d2 remote) are the minimum for cohort coherence, consent gating and
\* cross-draft retirement; COHORT_MAX = 3 is the minimum that reaches the
\* queue-replacement journey (in-flight + queued + a third capture that
\* replaces the unwritten queued one). REV_MAX = 1 is the honest minimum:
\* every safety property and witness keys on (revision, incarnation)
\* EQUALITY, never on revision magnitude — one edit separates a stale
\* clock from the current one, and the second staleness a two-revision
\* budget would buy is exercised by save/consent set changes instead.
\* Facet cost: each revision-valued clock is [DOCS -> 0..REV_MAX], so
\* REV_MAX 2 -> 1 shrinks seven such domains from 3^2 to 2^2 (~300x on
\* the cross product); measured 5.9M distinct states, exhaustive in
\* ~45 s on 4 workers (~2 min single-worker), versus non-settling at
\* REV_MAX = 2 (14M states in 60 s and growing). All six mutants still
\* die by exactly their named invariants and all ten witnesses stay
\* reachable (journeys re-checked at REV_MAX = 1).
SPECIFICATION Spec
CONSTANTS
    DOCS = {d1, d2}
    REMOTE = {d2}
    REV_MAX = 1
    COHORT_MAX = 3
    MUTATION = 0
\* Once the revision, cohort and witness budgets are spent, no action is
\* enabled — a model artifact, not a protocol deadlock.
CHECK_DEADLOCK FALSE
\* Budgets are model artifacts, not protocol states: a spent cohort
\* budget must not freeze staleness the u64 counter would recapture.
CONSTRAINT
    CohortBudgetHonest
INVARIANTS
    TypeOK
    CohortCoherent
    DurableMatchesLastComplete
    SaveRetiresOnlySuperseded
    CheckpointNeverCleans
    RemoteConsentGated
    RestoreNeverWritesDisk

