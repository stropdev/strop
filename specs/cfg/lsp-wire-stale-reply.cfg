\* LspWire faulty variant 4: a reply applies without the stamp freshness
\* check — a late/cancelled result publishes into a new owner.
\* Must die by EXACTLY LateNeverApplies.
SPECIFICATION Spec
CONSTANTS
    DOCS = {d1, d2}
    VER_MAX = 5
    REQ_MAX = 2
    QMAX = 3
    PEND_MAX = 2
    MUTATION = 4
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    WireOrdered
    VersionsIncrease
    CoalesceLegal
    BindingOnlyIfAdmitted
    TerminalOnce
    RequestAccounted
    LateNeverApplies
    Bounded
