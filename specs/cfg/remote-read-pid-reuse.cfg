\* RemoteRead faulty variant 3: the child is reaped without revoking the
\* pid capability first (process.rs wait()'s group.pid = None is the guard
\* being removed). The OS recycles the pid; a late detached cancel hook
\* then signals the NEW owner. Must die by EXACTLY SignalOwnedPid.
SPECIFICATION Spec
CONSTANTS
    REQS = {1, 2}
    PIDS = {1, 2}
    MAXFOCUS = 2
    MAXREV = 2
    MAXHEAD = 2
    MUTATION = 3
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    FreshPublication
    TerminalOnce
    CancellationWins
    SignalOwnedPid
    NoUnownedChild
    ReadonlyPublication
