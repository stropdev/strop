\* SftpWire: the shipped codec, honest guards (MUTATION = 0). The server
\* may answer with any reply in the model's finite dimensions; the client
\* must still satisfy every invariant. FSIZE = 3 with CHUNK = 2 exercises
\* a multi-read loop (2 then 1 bytes); MAXSEQ = 8 leaves the honest path
\* (5 ids: open, fstat, two reads, close) far from the cap.
SPECIFICATION Spec
CONSTANTS
    MAXPACKET = 3
    MAXSNAP = 4
    CHUNK = 2
    FSIZE = 3
    FILE_UTF8 = TRUE
    MAXSEQ = 8
    MUTATION = 0
\* Terminal DONE states are the intended end of every run; mid-protocol
\* states always have a server reply enabled. Deadlock checking is off
\* for the same reason as editor-protocol.cfg.
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    ReplyIdentity
    PacketBounded
    SnapshotBounded
    CompleteBeforeSuccess
