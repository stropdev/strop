\* Install: the AR11/AR12 staged/verified/atomic publication contract
\* (MUTATION = 0). Two versions plus a fresh install keep interruption,
\* rollback identity and the stale-catalog no-op representable.
SPECIFICATION Spec
CONSTANTS
    MUTATION = 0
\* Once the transaction budgets are spent, no action is enabled — a
\* model artifact, not a protocol deadlock.
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    InstalledComplete
    VerifiedBeforeActivation
    ChannelGate
    NoClobberOnFailure
    ReceiptNeverAhead
    StaleNeverPublishes
