\* RemoteProcess faulty variant 2, temporal companion: with the early reap
\* the final killpg can hit a recycled/foreign PGID, so the straggler group
\* is orphaned - no live member is ever killed and the anchor's cleanup
\* never settles it. Safety invariants that this mutant intentionally
\* breaks (ReapAfterFinalKill, SignalOwnedTarget) are omitted here; they
\* are checked by remote-process-early-reap.cfg.
SPECIFICATION FairSpec
CONSTANTS
    REQS = {1}
    LPIDS = {101}
    RPIDS = {1, 2}
    MAXBUF = 1
    MAXPEND = 1
    MUTATION = 2
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    TerminalOnce
    LaunchGated
    NoPostEofDelivery
    OutcomeClean
    NoUnownedSsh
PROPERTY EventuallyRemoteSettled
