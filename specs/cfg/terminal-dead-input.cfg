\* Terminal faulty variant 4: the exit boundary forgets to force panes
\* out of terminal-input, so a later key routes to a session whose child
\* is already dead. Must die by EXACTLY InputNeverToDead (and the
\* boundary invariant ExitBoundary).
SPECIFICATION Spec
CONSTANTS
    SESSIONS = {s1, s2}
    REV_MAX = 2
    MUTATION = 4
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    FrameFresh
    PinnedNeverDragged
    TerminalAbsorbing
    ExitBoundary
    ExitAnnouncedOnce
    InputNeverToDead
    GeometryOwned
    OutputNeverMutates
