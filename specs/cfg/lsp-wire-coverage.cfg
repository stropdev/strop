\* LspWire vacuity witnesses: a legal coalesce, a visible refusal, a
\* close/reopen re-incarnation, a pending request cancelled at close, a
\* startup flush, a rejected late reply, an applied fresh reply and a
\* connection restart with settlement — all must be reachable in the
\* honest model. The gate checks each witness separately and stops at
\* its first counterexample.
SPECIFICATION Spec
CONSTANTS
    DOCS = {d1, d2}
    VER_MAX = 5
    REQ_MAX = 2
    QMAX = 3
    PEND_MAX = 2
    MUTATION = 0
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    WitnessNoCoalesce
    WitnessNoRefusal
    WitnessNoReopen
    WitnessNoCancelNote
    WitnessNoFlush
    WitnessNoLateRejected
    WitnessNoApplied
    WitnessNoRestart
