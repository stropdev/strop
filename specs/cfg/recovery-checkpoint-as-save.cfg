\* Recovery faulty variant 3: capture snapshots the DISK baseline into the
\* cohort instead of the applied draft — checkpointing poses as saving, and
\* edits after the saved snapshot are never durable.
\* Must die by EXACTLY SaveRetiresOnlySuperseded.
SPECIFICATION Spec
CONSTANTS
    DOCS = {d1, d2}
    REMOTE = {d2}
    REV_MAX = 2
    COHORT_MAX = 3
    MUTATION = 3
CHECK_DEADLOCK FALSE
\* Budgets are model artifacts, not protocol states: a spent cohort
\* budget must not freeze staleness the u64 counter would recapture.
CONSTRAINT
    CohortBudgetHonest
INVARIANTS
    TypeOK
    CohortCoherent
    DurableMatchesLastComplete
    SaveRetiresOnlySuperseded
    CheckpointNeverCleans
    RemoteConsentGated
    RestoreNeverWritesDisk

