\* Terminal vacuity witnesses: a pinned view lagging live output, an
\* explicit refresh, an exit with retained final output, a denied host
\* effect, a dropped late update, an inspect/input/inspect reentry, an
\* editor-initiated close through Closing, two concurrent sessions and
\* the paste-ticket boundary — all must be reachable in the honest model.
\* The gate checks each witness separately and stops at its first
\* counterexample.
SPECIFICATION Spec
CONSTANTS
    SESSIONS = {s1, s2}
    REV_MAX = 2
    MUTATION = 0
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    WitnessNoPinnedLag
    WitnessNoRefresh
    WitnessNoExitRetained
    WitnessNoDenied
    WitnessNoLateDrop
    WitnessNoReentry
    WitnessNoClosing
    WitnessNoTwoSessions
    WitnessNoPasteBoundary
