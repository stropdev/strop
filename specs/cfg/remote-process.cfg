\* RemoteProcess: the shipped supervised remote-exec lifecycle (MUTATION = 0).
\* One supervised request end to end: local ssh ownership (hook-before-spawn,
\* kill-at-publication, revoke-before-reap), the READY->GO launch gate, the
\* anchor zombie's PID/PGID reservation, EOF-as-cancel with the last-chance
\* drain race, the bounded relay, the final killpg and the cleanup-then-line
\* ordering. Two remote pids make OS recycling (to a foreign process)
\* representable; the local ssh pid space is independent.
SPECIFICATION Spec
CONSTANTS
    REQS = {1}
    LPIDS = {101}
    RPIDS = {1, 2}
    MAXBUF = 2
    MAXPEND = 2
    MUTATION = 0
\* All-terminal states are intended; environment actions (caller, worker
\* code, OS reuse) may all be disabled once budgets are spent. Not a
\* protocol deadlock.
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    TerminalOnce
    LaunchGated
    SignalOwnedTarget
    ReapAfterFinalKill
    NoPostEofDelivery
    OutcomeClean
    NoUnownedSsh
