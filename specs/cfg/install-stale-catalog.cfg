\* Install faulty variant 5: a stale (not-newer) catalog publishes
\* anyway. Must die by EXACTLY StaleNeverPublishes.
SPECIFICATION Spec
CONSTANTS
    MUTATION = 5
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    InstalledComplete
    VerifiedBeforeActivation
    ChannelGate
    NoClobberOnFailure
    ReceiptNeverAhead
    StaleNeverPublishes
