\* LspWire faulty variant 2: a refused Open (queue full / versions
\* exhausted) still records the binding — the editor believes a binding
\* the wire never admitted. Must die by EXACTLY BindingOnlyIfAdmitted.
SPECIFICATION Spec
CONSTANTS
    DOCS = {d1}
    VER_MAX = 3
    REQ_MAX = 2
    QMAX = 3
    PEND_MAX = 2
    MUTATION = 2
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    WireOrdered
    VersionsIncrease
    CoalesceLegal
    BindingOnlyIfAdmitted
    TerminalOnce
    RequestAccounted
    LateNeverApplies
    Bounded
