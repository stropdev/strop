\* SftpWire faulty variant 2: Data longer than the request count is
\* buffered instead of faulting (over-read). The last chunk then pushes
\* `got` past the length captured at inspect.
\* Must die by EXACTLY SnapshotBounded.
SPECIFICATION Spec
CONSTANTS
    MAXPACKET = 3
    MAXSNAP = 4
    CHUNK = 2
    FSIZE = 3
    FILE_UTF8 = TRUE
    MAXSEQ = 8
    MUTATION = 2
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    ReplyIdentity
    PacketBounded
    SnapshotBounded
    CompleteBeforeSuccess
