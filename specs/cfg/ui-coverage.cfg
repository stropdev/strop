\* UiSession vacuity witnesses: a dropped publication, a poisoned
\* client, a resync recovery, an emitted clipboard effect, the three
\* typed base refusals, an orderly shutdown, an asynchronous publication
\* outrunning the client cache and a same-generation delta — all must be
\* reachable in the honest model. The gate checks each witness separately
\* and stops at its first counterexample.
SPECIFICATION Spec
CONSTANTS
    GEN_MAX = 4
    CREV_MAX = 2
    QMAX = 2
    ACT_MAX = 3
    EFF_MAX = 1
    DROP_MAX = 1
    RESYNC_MAX = 1
    ROGUE_MAX = 3
    MUTATION = 0
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    WitnessNoDrop
    WitnessNoPoison
    WitnessNoRecovery
    WitnessNoEffect
    WitnessNoStaleRefusal
    WitnessNoFutureRefusal
    WitnessNoForeignRefusal
    WitnessNoBye
    WitnessNoOutrun
    WitnessNoSameGenDelta
