\* RemoteProcess faulty variant 3: the relay's always-on HUP mask is
\* dropped - cancellation is not observed while the bounded buffer is
\* full, and pending stdin keeps being delivered after EOF ("deliver the
\* rest and wait" instead of EOF-commits-to-cancel). The honest events=0
\* poll makes POLLHUP visible regardless of backpressure.
\* Must die by EXACTLY NoPostEofDelivery (the temporal companion config
\* checks the lost cancellation itself).
SPECIFICATION Spec
CONSTANTS
    REQS = {1}
    LPIDS = {101}
    RPIDS = {1, 2}
    MAXBUF = 2
    MAXPEND = 2
    MUTATION = 3
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    TerminalOnce
    LaunchGated
    SignalOwnedTarget
    ReapAfterFinalKill
    NoPostEofDelivery
    OutcomeClean
    NoUnownedSsh
