\* Install faulty variant 2: publication overwrites the target in place,
\* so an interruption mid-write leaves staged-partial bytes installed.
\* Must die by EXACTLY InstalledComplete and NoClobberOnFailure.
SPECIFICATION Spec
CONSTANTS
    MUTATION = 2
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    InstalledComplete
    VerifiedBeforeActivation
    ChannelGate
    NoClobberOnFailure
    ReceiptNeverAhead
    StaleNeverPublishes
