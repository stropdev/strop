\* RemoteProcess faulty variant 4: run() returns success the moment the
\* worker's exit record is read - before the final killpg, before the
\* anchor is reaped, before the result line, while the local ssh child is
\* still live and unreaped. The honest path emits only after the exit
\* status was observed AND the ssh child was reaped AND the remote is
\* settled. Must die by EXACTLY OutcomeClean and NoUnownedSsh.
SPECIFICATION Spec
CONSTANTS
    REQS = {1}
    LPIDS = {101}
    RPIDS = {1, 2}
    MAXBUF = 2
    MAXPEND = 2
    MUTATION = 4
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    TerminalOnce
    LaunchGated
    SignalOwnedTarget
    ReapAfterFinalKill
    NoPostEofDelivery
    OutcomeClean
    NoUnownedSsh
