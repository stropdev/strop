\* Terminal: the 0055/0065 session lifecycle contract (MUTATION = 0).
\* Two sessions keep frame-identity separation representable; the
\* revision budget bounds per-session output.
SPECIFICATION Spec
CONSTANTS
    SESSIONS = {s1, s2}
    REV_MAX = 2
    MUTATION = 0
\* Once every budget is spent, no action is enabled — a model artifact,
\* not a protocol deadlock.
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    FrameFresh
    PinnedNeverDragged
    TerminalAbsorbing
    ExitBoundary
    ExitAnnouncedOnce
    InputNeverToDead
    GeometryOwned
    OutputNeverMutates
