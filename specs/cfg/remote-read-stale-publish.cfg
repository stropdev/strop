\* RemoteRead faulty variant 1: DeliverCompletion publishes without the
\* freshness gate, so a success delivered after focus/revision/document
\* moved lands anyway. Must die by EXACTLY FreshPublication.
SPECIFICATION Spec
CONSTANTS
    REQS = {1, 2}
    PIDS = {1, 2}
    MAXFOCUS = 2
    MAXREV = 2
    MAXHEAD = 2
    MUTATION = 1
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    FreshPublication
    TerminalOnce
    CancellationWins
    SignalOwnedPid
    NoUnownedChild
    ReadonlyPublication
