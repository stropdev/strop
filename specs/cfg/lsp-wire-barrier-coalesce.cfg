\* LspWire faulty variant 1: coalescing replaces a superseded unsent
\* snapshot ACROSS an admitted request barrier — the intermediate version
\* the request is answered against never reaches the wire.
\* Must die by EXACTLY CoalesceLegal.
SPECIFICATION Spec
CONSTANTS
    DOCS = {d1}
    VER_MAX = 3
    REQ_MAX = 2
    QMAX = 3
    PEND_MAX = 2
    MUTATION = 1
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    WireOrdered
    VersionsIncrease
    CoalesceLegal
    BindingOnlyIfAdmitted
    TerminalOnce
    RequestAccounted
    LateNeverApplies
    Bounded
