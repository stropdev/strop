\* UiSession: the 0056 AR09/AR10 UI session contract (MUTATION = 0).
\* One session keeps the admission/publication/poison discipline
\* representable; budgets force the interesting paths early: QMAX = 2
\* gives wire backpressure, GEN_MAX = 4 admits hello + three moved
\* publications, EFF_MAX = 1 stages one clipboard payload, DROP_MAX = 1
\* forces the poison path, ROGUE_MAX = 3 covers one rogue base per bad
\* kind. Budget exhaustion is a model artifact, not a protocol deadlock.
SPECIFICATION Spec
CONSTANTS
    GEN_MAX = 4
    CREV_MAX = 2
    QMAX = 2
    ACT_MAX = 3
    EFF_MAX = 1
    DROP_MAX = 1
    RESYNC_MAX = 1
    ROGUE_MAX = 3
    MUTATION = 0
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    StaleNeverActs
    FutureNeverActs
    ForeignNeverActs
    PoisonedNeverActs
    PoisonedUntilSnapshot
    NoEmptyPublication
    EffectExactlyOnce
    ByeAfterFinalAck
    NoPostByePublication
    CliNeverAhead
    PublishedNeverAhead
    ByeNeverStrandsEffects
