\* Terminal faulty variant 3: an exited session resurrects to running —
\* the terminal phase is not absorbing and the boundary can fire twice.
\* Must die by EXACTLY TerminalAbsorbing and ExitAnnouncedOnce.
SPECIFICATION Spec
CONSTANTS
    SESSIONS = {s1, s2}
    REV_MAX = 2
    MUTATION = 3
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    FrameFresh
    PinnedNeverDragged
    TerminalAbsorbing
    ExitBoundary
    ExitAnnouncedOnce
    InputNeverToDead
    GeometryOwned
    OutputNeverMutates
