\* LspWire faulty variant 5: the unsent-jobs count bound is ignored —
\* retention grows without limit behind a wedged connection.
\* Must die by EXACTLY Bounded.
SPECIFICATION Spec
CONSTANTS
    DOCS = {d1}
    VER_MAX = 3
    REQ_MAX = 2
    QMAX = 3
    PEND_MAX = 2
    MUTATION = 5
CHECK_DEADLOCK FALSE
