\* RemoteRead liveness: FairSpec adds weak fairness ONLY for worker-local
\* and OS-progress actions (InstallHook, SpawnChild, HookFires,
\* TransferDone, TransferFails, ReapChild, WorkSucceeds, WorkFails,
\* DiscardResult). Editor actions and delivery are the environment. The
\* temporal claims are qualified by the OS assumptions in the module
\* header (kill delivery, exit observation, the session deadline).
\* Progress projection retains two competing requests and one reusable PID.
\* Revision/focus staleness has the wider safety check; it does not govern worker cleanup.
SPECIFICATION FairSpec
CONSTANTS
    REQS = {1, 2}
    PIDS = {1}
    MAXFOCUS = 1
    MAXREV = 0
    MAXHEAD = 1
    MUTATION = 0
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    FreshPublication
    TerminalOnce
    CancellationWins
    SignalOwnedPid
    NoUnownedChild
    ReadonlyPublication
PROPERTY
    EventuallyTerminal
    EventuallyReaped
