\* RemoteRead vacuity witnesses: admission, a fresh publication, a
\* cancelled request whose child was killed, and a dropped success (the
\* stale-delivery race) must all be reachable in the honest model. This
\* The gate checks each witness separately and stops at its first counterexample.
SPECIFICATION Spec
CONSTANTS
    REQS = {1, 2}
    PIDS = {1, 2}
    MAXFOCUS = 2
    MAXREV = 2
    MAXHEAD = 2
    MUTATION = 0
CHECK_DEADLOCK FALSE
INVARIANTS
    TypeOK
    WitnessNoAdmission
    WitnessNoPublication
    WitnessNoCancelledChild
    WitnessNoDroppedSuccess
