\* Recovery vacuity witnesses: a durable cohort, a multi-document cohort,
\* a failed publication recovered from, a restore against a changed or
\* missing source, a crash followed by restore, a consent grant/revoke
\* cycle, an unwritten queued publication replaced by a newer capture, a
\* record retired by republication, a deliberate discard and the
\* memory-only product — all must be reachable in the honest model. The
\* gate checks each witness separately and stops at its first
\* counterexample.
SPECIFICATION Spec
CONSTANTS
    DOCS = {d1, d2}
    REMOTE = {d2}
    REV_MAX = 1
    COHORT_MAX = 3
    MUTATION = 0
CHECK_DEADLOCK FALSE
\* Budgets are model artifacts, not protocol states: a spent cohort
\* budget must not freeze staleness the u64 counter would recapture.
CONSTRAINT
    CohortBudgetHonest
INVARIANTS
    TypeOK
    WitnessNoDurable
    WitnessNoMultiDocCohort
    WitnessNoFailedPublish
    WitnessNoConflictRestore
    WitnessNoCrashRestore
    WitnessNoConsentCycle
    WitnessNoQueueReplace
    WitnessNoRetirement
    WitnessNoDiscard
    WitnessNoMemoryOnly

