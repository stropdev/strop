name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 0057 VF01: whole-core boundary/claim inventory completeness.
      # Every mutating/authority/IO boundary row must carry live evidence,
      # hash-bound to its owning sources; a boundary source change without
      # an evidence change fails here. Cheap and host-only, so it runs
      # first. Re-pin after re-review with verification/check.py --stamp.
      - name: Boundary inventory completeness (VF01)
        run: python3 verification/check.py

      # The gate is the docker compose test service (AGENTS.md): fmt +
      # clippy -D warnings + cargo test, at image-build time. One command,
      # no host toolchain, layer-cached.
      - name: Gate
        run: docker compose run --build --rm test

      - name: Real SSH native worker on a Python-free host
        run: docker compose run --build --rm ssh-pythonfree

      # 0058 WK17: finite worker session/deployment models, semantic
      # mutants and reached recovery/concurrent-cache witnesses.
      - name: Protocol model (TLC)
        run: docker compose run --build --rm model

      # 0057 VF18 / 0058 WK18: shipped edit, session, framing, recovery,
      # effect and deployment decisions from the same strop-core source.
      - name: Same-source admission and edit proofs (Verus)
        run: docker compose run --build --rm verify

      # SearchLifecycle, WorkerSession and WorkerDeploy induction with
      # paired negative controls. Same-source Verus kernels do not
      # discharge cross-client GC or native/platform evidence.
      - name: Inductive safety proof (TLAPS)
        run: docker compose run --build --rm tlaps

      # 0057 VF19 / 0058 WK16: claim/evidence digest binding, native
      # Store/recovery/stream effects, instrumented Loom and calibrated
      # semantic mutants.
      - name: Core assurance campaigns (VF19)
        run: docker compose run --build --rm core-assurance

      - name: Selected-context container worker and editor journeys
        run: docker compose run --build --rm container-test

  # GNU native execution is independent of static-musl image checks:
  # cross-compilation alone cannot qualify the arm64 worker.
  native-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, machine: x86_64 }
          - { runner: ubuntu-24.04-arm, machine: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned native compiler
        run: |
          sh .github/scripts/install-zig.sh "$RUNNER_TEMP/strop-zig"
          echo "ZIG=$RUNNER_TEMP/strop-zig/zig" >> "$GITHUB_ENV"
      - name: Install nested-editor test dependency
        run: sudo apt-get update && sudo apt-get install -y neovim
      - name: Exercise native worker Store streams and terminal
        run: |
          test "$(uname -m)" = "${{ matrix.machine }}"
          cargo test --locked -p strop-fs tests::store::
          cargo test --locked -p strop-worker exec::tests::
          cargo test --locked -p strop-worker-client --test loopback
          cargo test --locked -p strop-editor --test worker_stdio
          cargo test --locked -p strop-editor --test terminal_editor

  # Host-native macOS Store, framed worker and PTY ownership on both
  # architectures; a cross-built artifact is not execution evidence.
  native-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15-intel, machine: x86_64 }
          - { runner: macos-14, machine: arm64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned native compiler
        run: |
          sh .github/scripts/install-zig.sh "$RUNNER_TEMP/strop-zig"
          echo "ZIG=$RUNNER_TEMP/strop-zig/zig" >> "$GITHUB_ENV"
      - name: Install nested-editor test dependency
        run: brew install neovim
      - name: Exercise native Store worker protocol and terminal
        run: |
          test "$(uname -m)" = "${{ matrix.machine }}"
          cargo test --locked -p strop-fs tests::store::
          cargo test --locked -p strop-worker exec::tests::
          cargo test --locked -p strop-worker-client --test loopback
          cargo test --locked -p strop-editor --test terminal_editor
