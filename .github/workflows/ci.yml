name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # 0057 VF01: whole-core boundary/claim inventory completeness.
      # Every mutating/authority/IO boundary row must carry live evidence,
      # hash-bound to its owning sources; a boundary source change without
      # an evidence change fails here. Cheap and host-only, so it runs
      # first. Re-pin after re-review with verification/check.py --stamp.
      - name: Boundary inventory completeness (VF01)
        run: python3 verification/check.py

      # The gate is the docker compose test service (AGENTS.md): fmt +
      # clippy -D warnings + cargo test, at image-build time. One command,
      # no host toolchain, layer-cached.
      - name: Gate
        run: docker compose run --build --rm test

      - name: Real SSH native worker on a Python-free host
        run: docker compose run --build --rm ssh-pythonfree

      # 0058 WK17: finite worker session/deployment models, semantic
      # mutants and reached recovery/concurrent-cache witnesses.
      - name: Protocol model (TLC)
        run: docker compose run --build --rm model

      # 0057 VF18 / 0058 WK18: shipped edit, session, framing, recovery,
      # effect and deployment decisions from the same strop-core source.
      - name: Same-source admission and edit proofs (Verus)
        run: docker compose run --build --rm verify

      # SearchLifecycle, WorkerSession and WorkerDeploy induction with
      # paired negative controls. Same-source Verus kernels do not
      # discharge cross-client GC or native/platform evidence.
      - name: Inductive safety proof (TLAPS)
        run: docker compose run --build --rm tlaps

      # 0057 VF19 / 0058 WK16: claim/evidence digest binding, native
      # Store/recovery/stream effects, instrumented Loom and calibrated
      # semantic mutants.
      - name: Core assurance campaigns (VF19)
        run: docker compose run --build --rm core-assurance

      - name: Selected-context container worker and editor journeys
        run: docker compose run --build --rm container-test

  # GNU native execution is independent of static-musl image checks:
  # cross-compilation alone cannot qualify the arm64 worker.
  native-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, machine: x86_64, target: x86_64-unknown-linux-gnu }
          - { runner: ubuntu-24.04-arm, machine: aarch64, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pinned native compiler
        run: |
          sh .github/scripts/install-zig.sh "$RUNNER_TEMP/strop-zig"
          echo "ZIG=$RUNNER_TEMP/strop-zig/zig" >> "$GITHUB_ENV"
      - name: Install native test dependencies
        run: sudo apt-get update && sudo apt-get install -y neovim openssh-server clangd
      - name: Build native static worker for same-host OpenSSH
        run: |
          docker compose run --build --rm -v "$RUNNER_TEMP:/native-artifacts" release \
            sh -c 'install -m755 target/release/strop /native-artifacts/strop-musl-worker'
      - name: Exercise native worker Store streams and terminal
        run: |
          test "$(uname -m)" = "${{ matrix.machine }}"
          cargo test --locked -p strop-fs tests::store::
          cargo test --locked -p strop-worker exec::tests::
          cargo test --locked -p strop-terminal vt::tests::
          cargo test --locked -p strop-worker-client --test loopback
          STROP_WORKER_BINARY="$RUNNER_TEMP/strop-musl-worker" STROP_REQUIRE_SSH_TESTS=1 cargo test --locked -p strop-editor --test worker_ssh deploy_handshake_read_write_notify_parity_over_real_sshd
          cargo test --locked -p strop-editor --test worker_stdio
          cargo test --locked -p strop-editor --test terminal_editor
      - name: Benchmark matched native product artifacts
        run: |
          # Compare completion with the exact published native-worker release.
          git worktree add --detach "$RUNNER_TEMP/strop-baseline" a858e889113507ef50302286117193d9d4e99573
          CARGO_TARGET_DIR="$RUNNER_TEMP/strop-baseline-target" cargo build --release --locked \
            --manifest-path "$RUNNER_TEMP/strop-baseline/Cargo.toml" -p strop-editor
          cargo build --release --locked -p strop-editor
          # Cargo PTY tests build a test-support binary into target/release/strop.
          # Keep the production candidate outside Cargo's output tree so
          # baseline tests cannot replace its native worker with the in-process seam.
          install -m555 target/release/strop "$RUNNER_TEMP/strop-product-candidate"
          python3 -B verification/bench_native_product.py \
            --baseline "$RUNNER_TEMP/strop-baseline-target/release/strop" \
            --candidate "$RUNNER_TEMP/strop-product-candidate" --target "${{ matrix.target }}" \
            --out "$RUNNER_TEMP/strop-native-measurements"
          rustup component add rust-analyzer
          python3 -B verification/bench_lsp_ui.py \
            --binary "$RUNNER_TEMP/strop-baseline-target/release/strop" \
            --profile release-gnu-native --out "$RUNNER_TEMP/strop-native-measurements/baseline-lsp.json"
          python3 -B verification/bench_lsp_ui.py \
            --binary "$RUNNER_TEMP/strop-product-candidate" --profile release-gnu-native \
            --out "$RUNNER_TEMP/strop-native-measurements/candidate-lsp.json"
          python3 -B verification/bench_transfer_ui.py \
            --binary "$RUNNER_TEMP/strop-baseline-target/release/strop" \
            --profile release-gnu-native --out "$RUNNER_TEMP/strop-native-measurements/baseline-transfer.json"
          python3 -B verification/bench_transfer_ui.py \
            --binary "$RUNNER_TEMP/strop-product-candidate" --profile release-gnu-native \
            --out "$RUNNER_TEMP/strop-native-measurements/candidate-transfer.json"
          python3 -B verification/qualify_completion.py \
            --binary "$RUNNER_TEMP/strop-product-candidate" --profile release-gnu-native \
            --build "cargo build --release --locked -p strop-editor; native ${{ matrix.target }}" \
            --out "$RUNNER_TEMP/strop-native-measurements/completion.json"
          STROP_BENCH_BINARY="$RUNNER_TEMP/strop-product-candidate" cargo test --release --locked \
            -p strop-editor --test terminal_editor completion:: -- --include-ignored --nocapture
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-product-${{ matrix.target }}
          path: ${{ runner.temp }}/strop-native-measurements/
          if-no-files-found: error

  # Host-native Apple Silicon Store, framed worker and PTY ownership;
  # cross-compilation alone is not execution evidence.
  native-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install pinned native compiler
        run: |
          sh .github/scripts/install-zig.sh "$RUNNER_TEMP/strop-zig"
          echo "ZIG=$RUNNER_TEMP/strop-zig/zig" >> "$GITHUB_ENV"
      - name: Install real editor and language-server dependencies
        run: |
          brew install neovim llvm
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
      - name: Exercise native Store protocol and VT kernel
        timeout-minutes: 20
        run: |
          test "$(uname -m)" = "arm64"
          cargo test --locked -p strop-fs tests::store::
          cargo test --locked -p strop-worker exec::tests::
          cargo test --locked -p strop-terminal vt::tests::
          cargo test --locked -p strop-worker-client --test loopback
      - name: Exercise real native OpenSSH worker
        timeout-minutes: 20
        run: STROP_REQUIRE_SSH_TESTS=1 cargo test --locked -p strop-editor --test worker_ssh deploy_handshake_read_write_notify_parity_over_real_sshd
      - name: Exercise native worker binary lifecycle
        timeout-minutes: 12
        run: cargo test --locked -p strop-editor --test worker_stdio
      - name: Exercise real native terminal editor
        timeout-minutes: 12
        run: cargo test --locked -p strop-editor --test terminal_editor
      - name: Benchmark matched native product artifacts
        run: |
          git worktree add --detach "$RUNNER_TEMP/strop-baseline" a858e889113507ef50302286117193d9d4e99573
          CARGO_TARGET_DIR="$RUNNER_TEMP/strop-baseline-target" cargo build --release --locked \
            --manifest-path "$RUNNER_TEMP/strop-baseline/Cargo.toml" -p strop-editor
          cargo build --release --locked -p strop-editor
          # The candidate's producer is cargo build; subsequent release
          # PTY tests may write a test-support binary to target/release/strop.
          install -m555 target/release/strop "$RUNNER_TEMP/strop-product-candidate"
          python3 -B verification/bench_native_product.py \
            --baseline "$RUNNER_TEMP/strop-baseline-target/release/strop" \
            --candidate "$RUNNER_TEMP/strop-product-candidate" --target aarch64-apple-darwin \
            --out "$RUNNER_TEMP/strop-native-measurements"
          rustup component add rust-analyzer
          python3 -B verification/bench_lsp_ui.py \
            --binary "$RUNNER_TEMP/strop-baseline-target/release/strop" \
            --profile release-macos-native --out "$RUNNER_TEMP/strop-native-measurements/baseline-lsp.json"
          python3 -B verification/bench_lsp_ui.py \
            --binary "$RUNNER_TEMP/strop-product-candidate" --profile release-macos-native \
            --out "$RUNNER_TEMP/strop-native-measurements/candidate-lsp.json"
          python3 -B verification/bench_transfer_ui.py \
            --binary "$RUNNER_TEMP/strop-baseline-target/release/strop" \
            --profile release-macos-native --out "$RUNNER_TEMP/strop-native-measurements/baseline-transfer.json"
          python3 -B verification/bench_transfer_ui.py \
            --binary "$RUNNER_TEMP/strop-product-candidate" --profile release-macos-native \
            --out "$RUNNER_TEMP/strop-native-measurements/candidate-transfer.json"
          python3 -B verification/qualify_completion.py \
            --binary "$RUNNER_TEMP/strop-product-candidate" --profile release-macos-native \
            --build "cargo build --release --locked -p strop-editor; native aarch64-apple-darwin" \
            --out "$RUNNER_TEMP/strop-native-measurements/completion.json"
          STROP_BENCH_BINARY="$RUNNER_TEMP/strop-product-candidate" cargo test --release --locked \
            -p strop-editor --test terminal_editor completion:: -- --include-ignored --nocapture
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-product-aarch64-apple-darwin
          path: ${{ runner.temp }}/strop-native-measurements/
          if-no-files-found: error
