name: ci

# The blocking gates (plans/0086 §8). Every job here must be green on the
# commit a release is cut from: `.github/scripts/release-local.sh qualify`
# refuses a commit whose ci run is not successful. The Lean `proofs` gate
# needs a ~20 GB toolchain image that does not fit a hosted runner, so it
# runs in local qualification instead (same compose service, same rule).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: fmt + clippy -D warnings + cargo test + Loom
        run: docker compose run --build --rm test

  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: TLC probation models
        run: docker compose run --build --rm model

  ssh-pythonfree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Remote editing over real SSH on a Python-free host
        run: docker compose run --build --rm ssh-pythonfree

  # The required status check on `main` (branch protection names `gate`):
  # green only when every lane above is green.
  gate:
    runs-on: ubuntu-latest
    needs: [test, model, ssh-pythonfree]
    if: always()
    steps:
      - name: Every lane is green
        run: |
          test "${{ needs.test.result }}" = success
          test "${{ needs.model.result }}" = success
          test "${{ needs.ssh-pythonfree.result }}" = success
