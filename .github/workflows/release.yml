name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # artifact attestations: every release tarball gets a signed
  # provenance statement — `gh attestation verify <file> -R stropdev/strop`
  id-token: write
  attestations: write

# Two tags cut at once race the homebrew-tap push — serialize; the
# newer tag waits (the gripsack lesson).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Protocol release gate
        run: docker compose run --build --rm model
      - name: Locked workspace, native Store and real SSH gate
        run: docker compose run --build --rm test
      - name: Python-free real SSH deployment and worker parity
        run: docker compose run --build --rm ssh-pythonfree
      - name: Same-source Verus gate
        run: docker compose run --build --rm verify
      - name: Search, session and deploy TLAPS safety gates
        run: docker compose run --build --rm tlaps
      - name: Native correspondence and calibrated mutants
        run: docker compose run --build --rm core-assurance
      - name: Selected-context container worker gate
        run: docker compose run --build --rm container-test
      - name: Freeze exact committed worker candidate
        run: |
          python3 verification/check.py --release
          python3 verification/freeze.py
          python3 verification/freeze.py --check
      - uses: actions/upload-artifact@v7
        with:
          name: dist-source
          path: dist/worker-candidate.json

  # Execute native GNU workers on both architectures; musl artifact
  # jobs below separately qualify static release binaries.
  native-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, machine: x86_64 }
          - { runner: ubuntu-24.04-arm, machine: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned compiler for native Git/library paths
        run: |
          sh .github/scripts/install-zig.sh "$RUNNER_TEMP/strop-zig"
          echo "ZIG=$RUNNER_TEMP/strop-zig/zig" >> "$GITHUB_ENV"
      - name: Execute native worker/store/terminal on the selected CPU
        run: |
          test "$(uname -m)" = "${{ matrix.machine }}"
          cargo test --locked -p strop-fs tests::store::
          cargo test --locked -p strop-worker-client --test loopback
          cargo test --locked -p strop-editor --test worker_stdio
          cargo test --locked -p strop-editor --test terminal_editor

  # Musl-static Linux builds run natively in multi-arch Docker; both
  # macOS artifacts build and exercise PTY ownership on matching native
  # Intel and Apple Silicon runners (no cross-only platform badge).
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-latest, docker: true }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm, docker: true }
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
          - { target: aarch64-apple-darwin, runner: macos-14 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Build (linux musl, docker)
        if: matrix.docker
        run: |
          docker compose run --build --rm \
            -e "VERSION=${GITHUB_REF_NAME#v}" \
            -e "TARGET=${{ matrix.target }}" release

      - name: Install pinned native build compiler
        if: "!matrix.docker"
        run: |
          sh .github/scripts/install-zig.sh "$RUNNER_TEMP/strop-zig"
          echo "ZIG=$RUNNER_TEMP/strop-zig/zig" >> "$GITHUB_ENV"

      - name: Verify native macOS Store worker and terminal
        if: "!matrix.docker"
        run: |
          cargo test --locked -p strop-fs tests::store::
          cargo test --locked -p strop-worker-client --test loopback
          cargo test --locked -p strop-editor --test terminal_editor

      - name: Build (macOS, native)
        if: "!matrix.docker"
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --locked --target ${{ matrix.target }} -p strop-editor
          VERSION="${GITHUB_REF_NAME#v}"
          PKG="strop-$VERSION-${{ matrix.target }}"
          staging="$(mktemp -d)"
          mkdir -p "$staging/$PKG"
          install -m755 "target/${{ matrix.target }}/release/strop" "$staging/$PKG/strop"
          mkdir -p dist
          tar -czf "dist/$PKG.tar.gz" -C "$staging" "$PKG"
          (cd dist && shasum -a 256 "$PKG.tar.gz" > "$PKG.tar.gz.sha256")

      # Static-verify the honest way (0002 §4): a static-pie musl binary
      # still prints an ld-musl line in ldd, so `ldd | grep` gates lie in
      # both directions. No NEEDED entries is the truth. Plus a headless
      # smoke that actually exercises tree-sitter (a .rs frame render).
      - name: "Verify (linux: fully static + headless parse)"
        if: matrix.docker
        run: |
          cd dist
          sha256sum -c strop-*.tar.gz.sha256
          tmp="$(mktemp -d)"
          tar -xzf strop-*-${{ matrix.target }}.tar.gz -C "$tmp"
          bin="$(find "$tmp" -type f -name strop | head -1)"
          file "$bin"
          file "$bin" | grep -qE "static-pie linked|statically linked"
          if readelf -d "$bin" | grep -q NEEDED; then
            echo "::error::dynamic dependency in static release"
            exit 1
          fi
          "$bin" --version
          printf 'fn main() { let x = 1; }\n' > "$tmp/smoke.rs"
          printf 'frame\n' > "$tmp/smoke.txt"
          "$bin" --headless "$tmp/smoke.txt" "$tmp/smoke.rs" | grep -q "fn main"
          # WK05: worker mode is the same static binary; EOF on stdin is a
          # clean shutdown, so this proves headless worker init with no
          # GUI/TUI/runtime dependency.
          timeout 15 "$bin" --worker-stdio </dev/null

      - name: "Verify (macOS: system libs only + headless parse)"
        if: "!matrix.docker"
        run: |
          cd dist
          shasum -a 256 -c strop-*.tar.gz.sha256
          tmp="$(mktemp -d)"
          tar -xzf strop-*-${{ matrix.target }}.tar.gz -C "$tmp"
          bin="$(find "$tmp" -type f -name strop | head -1)"
          file "$bin"
          otool -L "$bin"
          if otool -L "$bin" | sed '1d' | grep -qvE "^[[:space:]]+(/usr/lib/(libSystem|libiconv|libz)[^ ]*|/System/Library/Frameworks/(CoreFoundation|Security|SystemConfiguration)\\.framework/[^ ]*)[[:space:]]"; then
            echo "::error::non-system dynamic dependency"
            exit 1
          fi
          "$bin" --version
          printf 'fn main() { let x = 1; }\n' > "$tmp/smoke.rs"
          printf 'frame\n' > "$tmp/smoke.txt"
          "$bin" --headless "$tmp/smoke.txt" "$tmp/smoke.rs" | grep -q "fn main"
          # WK05 worker smoke (no timeout on macOS runners; EOF is a
          # deterministic clean shutdown, so this returns immediately).
          "$bin" --worker-stdio </dev/null

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*

  release:
    needs: [build, protocol, native-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract checked-in release notes before publishing
        run: |
          python3 .github/scripts/changelog-notes.py "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.txt"

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Revalidate source candidate after artifact merge
        run: python3 verification/freeze.py --check --out dist/worker-candidate.json

      - name: Verify all four platform tarballs are present
        run: |
          ls -la dist/
          count="$(ls dist/strop-*.tar.gz | wc -l)"
          test "$count" -eq 4 || {
            echo "::error::expected 4 platform tarballs, got $count"; exit 1; }

      # 0056 AR12: the generated release catalog is the single source of
      # truth for version/artifact/digest facts — install.sh, `strop
      # update` and the site all resolve "latest" through it. It ships as
      # a release asset, so releases/latest/download/catalog.json always
      # tracks the newest tag (that URL is the site repo's handoff).
      # 0058 WK05: the catalog also carries the worker compatibility
      # manifest (protocol, min editor, targets, byte sizes). The facts
      # are extracted from the pinned source constants — never hand-edited
      # here — so a protocol bump without a catalog bump fails the tag.
      - name: Generate the release catalog
        run: |
          protocol=$(sed -n 's/^pub const PROTOCOL_VERSION: u32 = \([0-9][0-9]*\);$/\1/p' \
            crates/strop-worker-protocol/src/message.rs)
          min_editor=$(sed -n 's/^pub const MIN_EDITOR_VERSION: &str = "\([^"]*\)";$/\1/p' \
            crates/strop-worker-deploy/src/lib.rs)
          [ -n "$protocol" ] && [ -n "$min_editor" ] || {
            echo "::error::worker compatibility constants not found in source"; exit 1; }
          python3 .github/scripts/release-catalog.py catalog \
            --tag "$GITHUB_REF_NAME" --dist dist --out dist/catalog.json \
            --worker-protocol "$protocol" --worker-min-editor "$min_editor"

      # signed build provenance for every tarball (the gripsack lesson,
      # plan/0020 §5.8 there): verify with
      # `gh attestation verify <file> -R stropdev/strop`
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/strop-*.tar.gz


      # crates.io before the GitHub release: it is the irreversible
      # artifact. The guard fails a mistagged release instead of
      # publishing the wrong version. crates.io `strop` is taken; the
      # package publishes as `strop-editor` (0001 §naming).
      - uses: dtolnay/rust-toolchain@stable
      - name: Install pinned source-package compiler
        run: |
          sh .github/scripts/install-zig.sh "$RUNNER_TEMP/strop-zig"
          echo "ZIG=$RUNNER_TEMP/strop-zig/zig" >> "$GITHUB_ENV"

      - name: Publish to crates.io (dependency order)
        id: crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          pkg="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "strop-editor") | .version')"
          test "v$pkg" = "$GITHUB_REF_NAME" || {
            echo "::error::tag $GITHUB_REF_NAME != crate version v$pkg"; exit 1; }
          failed=""
          # Actual dependency edges, not direct-dependency counts. A new
          # transport crate must never publish ahead of its core dependency.
          crates=$(cargo metadata --no-deps --format-version 1 \
            | python3 .github/scripts/publish-order.py)
          for crate in $crates; do
            ok=""
            for attempt in 1 2 3 4 5 6 7 8; do
              if out="$(cargo publish -p "$crate" 2>&1)"; then
                ok=1; break
              fi
              echo "$out" | tail -5
              if echo "$out" | grep -q "already exists"; then
                echo "$crate already published — skipping"; ok=1; break
              fi
              echo "::warning::publish of $crate failed (attempt $attempt); backing off"
              sleep 90
            done
            [ -n "$ok" ] || failed="$failed $crate"
          done
          [ -z "$failed" ] || { echo "::error::failed to publish:$failed"; exit 1; }

      # Tap bump: formula builds from the crate, cask ships the prebuilt
      # darwin binaries. Needs HOMEBREW_TAP_TOKEN (fine-grained PAT,
      # contents:write on stropdev/homebrew-tap) — skipped while unset.
      - name: Bump homebrew formula + cask
        id: homebrew
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        if: env.HAS_TAP_TOKEN != ''
        run: |
          ver="${GITHUB_REF_NAME#v}"
          sha="$(curl -fsSL "https://static.crates.io/crates/strop-editor/strop-editor-$ver.crate" | sha256sum | cut -d' ' -f1)"
          gh repo clone stropdev/homebrew-tap /tmp/tap -- --depth 1
          mkdir -p /tmp/tap/Formula /tmp/tap/Casks
          cat > /tmp/tap/Formula/strop.rb <<EOF
          class Strop < Formula
            desc "Modal text editor — see the cut before you make it"
            homepage "https://strop.dev/"
            url "https://static.crates.io/crates/strop-editor/strop-editor-$ver.crate"
            sha256 "$sha"
            license "MIT"

            depends_on "rust" => :build

            def install
              system "cargo", "install", *std_cargo_args
            end

            test do
              assert_match "strop #{version}", shell_output("#{bin}/strop --version")
            end
          end
          EOF
          sha_arm="$(cut -d' ' -f1 "dist/strop-$ver-aarch64-apple-darwin.tar.gz.sha256")"
          sha_x64="$(cut -d' ' -f1 "dist/strop-$ver-x86_64-apple-darwin.tar.gz.sha256")"
          cat > /tmp/tap/Casks/strop.rb <<EOF
          cask "strop" do
            arch arm: "aarch64", intel: "x86_64"

            version "$ver"
            sha256 arm:   "$sha_arm",
                   intel: "$sha_x64"

            url "https://github.com/stropdev/strop/releases/download/v#{version}/strop-#{version}-#{arch}-apple-darwin.tar.gz"
            name "strop"
            desc "Modal text editor — see the cut before you make it"
            homepage "https://strop.dev/"

            binary "strop-#{version}-#{arch}-apple-darwin/strop"
          end
          EOF
          cd /tmp/tap
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/stropdev/homebrew-tap.git"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/strop.rb Casks/strop.rb
          git commit -m "strop $ver"
          git push

      - name: Create GitHub release
        id: ghrelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "strop $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release-notes.txt"

      # Redeploy the site so the version chip and demo stay current.
      # Best-effort: a site hiccup must not fail a release.
      - name: Ping the site to redeploy
        id: siteping
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
        run: |
          gh api repos/stropdev/stropdev.github.io/dispatches \
            -f event_type=rebuild

      # Ship the changelog and the canonical installer with the release:
      # vendor CHANGELOG.md + install.sh (0056 AR12: one installer copy,
      # no stale duplicated site installer) into the site repo, rebuild
      # changelog.html (the checked-in script), push. Best-effort like
      # the redeploy ping.
      - name: Publish changelog and installer to the site repo
        id: changelog
        continue-on-error: true
        env:
          SITE_TOKEN: ${{ secrets.SITE_REPO_TOKEN }}
        run: |
          set -e
          git clone --depth 1 "https://x-access-token:${SITE_TOKEN}@github.com/stropdev/stropdev.github.io.git" /tmp/site
          cp CHANGELOG.md /tmp/site/CHANGELOG.md
          cp install.sh /tmp/site/install.sh
          (cd /tmp/site && python3 build_changelog.py)
          git -C /tmp/site config user.name "github-actions[bot]"
          git -C /tmp/site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C /tmp/site add CHANGELOG.md changelog.html install.sh
          git -C /tmp/site commit -m "changelog + installer: strop ${GITHUB_REF_NAME}" || echo "no site change"
          git -C /tmp/site push

      # 0056 AR12: promotion evidence is observable. Record every
      # promotion step in a resumable ledger, verify the actual public
      # download facts against the build outputs, and attach the ledger
      # to the release. A partially promoted release (e.g. site hiccup)
      # is recorded honestly, never hidden behind a fully-promoted status.
      - name: Record promotion evidence and verify public facts
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LEDGER="$RUNNER_TEMP/promotion.json"
          rec() {
            status="$2"
            python3 .github/scripts/release-catalog.py ledger \
              --file "$LEDGER" --tag "$GITHUB_REF_NAME" \
              --step "$1" --status "${status:-skipped}" ${3:+--detail "$3"}
          }
          rec crates.io "${{ steps.crates.outcome }}"
          rec homebrew-tap "${{ steps.homebrew.outcome }}"
          rec github-release "${{ steps.ghrelease.outcome }}"
          rec site-rebuild-dispatch "${{ steps.siteping.outcome }}"
          rec site-changelog "${{ steps.changelog.outcome }}"

          if [ "${{ steps.ghrelease.outcome }}" != "success" ]; then
            echo "::warning::release not created; ledger kept as workflow artifact only"
            exit 0
          fi

          # The catalog served at /releases/latest/download/ must record
          # exactly what this workflow built — that is what install.sh,
          # `strop update` and the site will resolve.
          curl -fsSL -o "$RUNNER_TEMP/public-catalog.json" \
            https://github.com/stropdev/strop/releases/latest/download/catalog.json
          python3 .github/scripts/release-catalog.py verify \
            --local dist/catalog.json --public "$RUNNER_TEMP/public-catalog.json"
          rec public-download-facts ok

          # Rendered-site evidence: the site repo rebuilds asynchronously
          # off the dispatch, so record what is observable now — never a
          # misleading fully-promoted status.
          if curl -fsSL https://strop.dev/ | grep -q "${GITHUB_REF_NAME#v}"; then
            rec rendered-site-version ok
          else
            rec rendered-site-version pending \
              "site rebuild is asynchronous; version not yet rendered"
          fi

          # Resumable: a re-run rewrites the ledger asset in place.
          gh release upload "$GITHUB_REF_NAME" "$LEDGER" --clobber

      - name: Upload the promotion ledger
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: promotion-ledger
          path: ${{ runner.temp }}/promotion.json
          if-no-files-found: warn
