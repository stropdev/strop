name: release

# Publication is local and manual. This workflow never builds, signs,
# publishes packages or uploads release assets.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Explain local publication authority
        run: |
          echo 'No publication performed.'
          echo 'Follow plans/0079-local-linux-release.md.'
          echo 'Qualify locally with .github/scripts/release-local.sh, then draft and publish the exact local artifacts.'
